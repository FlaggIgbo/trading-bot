# =============================================================================
# Minimal baseline — merged on top of config.yaml by config.get_config() by default.
# Disable: TRADING_BOT_MINIMAL_OVERLAY=0  (or false / no / off)
# Goal: CONSERVATIVE DEFENSE — stops overconfident noise trading.
# =============================================================================

execution:
  price_strategy: aggressive
  limit_offset_cents: 1
  resting_cancel_if_market_bid_above_limit_by: 0.03
  limit_buy_cross_spread_min_edge: 0.20 # Increased hurdle
  limit_buy_near_market_min_edge: 0.15 # Increased hurdle
  limit_buy_passive_only_below_edge: 0.15

recovery:
  min_edge: 0.15
  uncertainty_edge_mult: 1.0
  vol_disagree_extra_edge: 0.05
  ultra_short_min_edge_mult: 3.0 # BLOCK ultra-short unless massive edge

strategy:
  strategy_engine: vol_regime_threshold
  vol_blend_weight: 0.20 # Trust model even less
  use_intraday_empirical: true
  empirical_recent_days: 45 # More recent focus
  empirical_recent_weight: 2.5
  
  # 0.30 = extreme shrink toward 0.5 (stops hallucinating)
  model_probability_shrinkage: 0.30
  enable_model_prob_hard_cap: true
  model_prob_hard_lo: 0.10
  model_prob_hard_hi: 0.90
  
  use_bucket_penalty: true
  use_calibration: true
  use_sklearn_calibration: false
  enable_signal_model: false
  enable_auto_signal_weight_fit: false

  anti_hallucination:
    bayesian_enabled: true
    bayesian_market_strength: 15.0 # Very strong pull to market
    ewma_prob_enabled: true
    vol_zscore_enabled: true
    adaptive_edge_enabled: true
    regime_filter_enabled: true
    regime_block_buy_no_in_uptrend: true
    regime_block_buy_yes_in_downtrend: true

  simple_ev_decision:
    enabled: true
    min_edge: 0.15 
    min_edge_full: 0.25
    skip_p_win_mid_band_enabled: true
    skip_p_win_mid_lo: 0.40
    skip_p_win_mid_hi: 0.60
    kelly_dampen: 0.10 # Max 10% of Kelly (extremely conservative)
    max_bankroll_fraction: 0.01
    edge_size_boost_edge: 0.30
    edge_size_boost_mult: 1.02
    spread_wide_fraction: 0.10
    spread_wide_size_mult: 0.2
    ultra_short_size_mult: 0.2 # Drastically reduce size on 15m noisy markets

  log_effective_min_edge: true
  log_decision_diagnostics: true
  filter_disjoint_underlying_buys: true
  max_bankroll_fraction_per_underlying: 0.12
  max_bankroll_fraction_per_direction: 0.10
  min_edge: 0.15
  min_edge_easy_win: 0.25
  enable_easy_win: false
  consensus_sniper_enabled: false
  barbell_enabled: false

  uncertainty_edge_mult: 0.5
  vol_disagree_extra_edge: 0.02
  yes_overconfidence_extra_edge: 0.04
  parity_penalty_enabled: true
  adaptive_learning_enabled: true # Enable learning to react to losses

  enable_vol_regime_scaling: true
  enable_vol_spike_safety: true
  enable_defensive_mode: true
  dte_edge_scaling_enabled: true
  ultra_short_min_edge_mult: 3.0
  ultra_short_late_min_edge_mult: 4.0 # Nearly impossible to trade very late 15m noise

  limit_order_mode: layered
  layered_order_levels: 2
  limit_dip_pct: 0.05 # Wait for deeper dips
  max_dip_cap: 0.15

  max_pct_of_book_volume: 0.20
  min_order_book_depth: 20 # Require more liquidity
  stop_loss_pct: 0.15 # Tighter stop losses
  
  alpha_engine:
    obi_enabled: true
    markout_enabled: true
    lead_lag_enabled: true
    vol_adjusted_kelly_enabled: true
