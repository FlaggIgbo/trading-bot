# =============================================================================
# Minimal baseline — merged on top of config.yaml by config.get_config() by default.
# Goal: HIGH PNL + HIGH VOLUME — addressing overconfidence and passive execution.
# UPDATED: Applying latest user-recommended action plan to break death spiral.
# =============================================================================

execution:
  price_strategy: aggressive
  limit_offset_cents: 3 # Match config.yaml
  resting_cancel_if_market_bid_above_limit_by: 0.01
  limit_buy_edge_aggression_enabled: true
  limit_buy_cross_spread_min_edge: 0.02 # Match feedback (was 0.08)
  limit_buy_near_market_min_edge: 0.02 # Match feedback (was 0.03)
  limit_buy_passive_only_below_edge: 0.04
  limit_buy_medium_spread_fraction: 0.80 # Match feedback (was 1.0)
  limit_buy_escalation_price_enabled: true
  limit_buy_escalate_after_minutes_1: 1.0
  limit_buy_escalate_after_minutes_2: 3.0
  limit_buy_wide_book_coalesce_enabled: true
  passive_limit_quote: mid

recovery:
  min_edge: 0.08 # Match config.yaml
  uncertainty_edge_mult: 0.20
  vol_disagree_extra_edge: 0.03
  yes_overconfidence_extra_edge: 0.01
  ultra_short_min_edge_mult: 1.2
  ultra_short_min_p_win: 0.55

strategy:
  strategy_engine: vol_regime
  vol_blend_weight: 0.40
  use_intraday_empirical: true
  empirical_recent_days: 60
  empirical_recent_weight: 5.0
  
  # Market probability filters
  market_prob_lo: 0.01
  market_prob_hi: 0.99
  max_contracts_per_underlying: 5
  max_buy_yes_strike_above_pct: 0.15
  max_buy_no_strike_above_pct: 0.15

  # Probability shrinkage: 1.0 = disabled (using Forceful mapping)
  model_probability_shrinkage: 1.0
  enable_model_prob_hard_cap: true
  model_prob_hard_lo: 0.05
  model_prob_hard_hi: 0.85 # Match feedback
  
  drawdown_stop_trading_pct: 0.50
  drawdown_cooldown_hours: 6.0
  
  use_bucket_penalty: false # Match feedback
  bucket_override_weight: 0.15 # Match feedback
  min_bucket_samples: 15 # Match feedback
  use_calibration: true
  use_sklearn_calibration: true
  enable_signal_model: true
  enable_auto_signal_weight_fit: true
  calibration_min_date: "2026-04-15" # Match feedback

  # Disagreement dip
  enable_disagreement_dip: true
  disagreement_dip_min_gap: 0.35

  anti_hallucination:
    bayesian_enabled: false # Consolidated
    bayesian_market_strength: 10.0
    ewma_prob_enabled: true
    ewma_prob_blend_weight: 0.60
    vol_zscore_enabled: true
    adaptive_edge_enabled: true
    regime_filter_enabled: true
    regime_block_buy_no_in_uptrend: true
    regime_block_buy_yes_in_downtrend: false

  simple_ev_decision:
    enabled: true
    min_edge: 0.08
    kelly_dampen: 0.15
    max_bankroll_fraction: 0.08
    edge_size_boost_edge: 0.10
    edge_size_boost_mult: 1.5
    ultra_short_size_mult: 0.8

  log_effective_min_edge: true
  log_decision_diagnostics: true
  filter_disjoint_underlying_buys: false
  max_bankroll_fraction_per_underlying: 0.20
  max_bankroll_fraction_per_direction: 0.15
  min_edge: 0.18
  
  # Execution Friction Gates
  max_spread_pct: 0.18
  min_order_book_depth: 20
  taker_edge_threshold: 0.20

  parity_penalty_enabled: true
  parity_lookback_days: 14 # Match feedback
  adaptive_learning_enabled: true

  # Tiered min edge
  tiered_min_edge:
    enabled: true
    min_edge: 0.08
    bands:
      - { lo: 0.00, hi: 0.02, min_edge: 0.15 }
      - { lo: 0.02, hi: 0.15, min_edge: 0.10 }
      - { lo: 0.15, hi: 0.40, min_edge: 0.05 }
      - { lo: 0.40, hi: 0.65, min_edge: 0.08 }
      - { lo: 0.65, hi: 1.00, min_edge: 0.05 }

  enable_vol_regime_scaling: true
  enable_vol_spike_safety: true
  enable_defensive_mode: true
  dte_edge_scaling_enabled: true

  limit_order_mode: layered
  limit_dip_pct: 0.02 # Match feedback
  max_dip_cap: 0.01

  max_pct_of_book_volume: 0.25
  stop_loss_pct: 0.25
  
  alpha_engine:
    obi_enabled: true
    markout_enabled: true
    lead_lag_enabled: true
    vol_kelly_enabled: true
