[project]
name = "trading-bot"
version = "0.1.0"
description = "Kalshi 15-minute crypto prediction market trading bot"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "cryptography>=42.0.0",
]

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "F841", "F401", "W293", "W291"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "smoke: Quick happy-path sanity checks to run locally before git push",
]
