[project]
name = "trading-bot"
version = "0.1.0"
description = "Kalshi & Gemini prediction market trading bot"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "cryptography>=42.0.0",
    "PyYAML>=6.0",
    "yfinance>=0.2.36",
    "ollama>=0.3.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "streamlit>=1.28.0",
]

[tool.ruff]
target-version = "py39"
line-length = 120
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.format]
quote-style = "double"

[tool.ruff.isort]
known-first-party = ["config", "constants", "storage", "yfinance_client", "kalshi_client", "gemini_client", "ollama_analysis"]
