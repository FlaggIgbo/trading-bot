[project]
name = "trading-bot"
version = "0.1.0"
description = "Kalshi & Gemini prediction market trading bot"
requires-python = ">=3.9"
dependencies = []

[tool.ruff]
target-version = "py39"
line-length = 120
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.format]
quote-style = "double"

[tool.ruff.isort]
known-first-party = ["config", "constants", "storage", "yfinance_client", "kalshi_client", "gemini_client", "ollama_analysis"]
