# Shift Yahoo wholesale RBOB ($/gal) toward retail (e.g. AAA national) for model vs Kalshi strikes.
# adjusted = yahoo_price * multiply + add. Tune add ~0.70–1.10 vs current RB=F–AAA gap.
yfinance_underlying_adjust:
  KXAAAGASW:
    multiply: 1.0
    add: 0.90 # mid of ~$0.70–$1.10 retail premium over RB=F; not a fixed Kalshi settlement guarantee
    # Residual error vs gasprices.aaa.com (Kalshi source): wider strike sanity + higher edge hurdle
    extra_min_edge: 0.025
    strike_validation_tolerance_pct: 0.09
  KXCORNW:
    extra_min_edge: 0.10 # High slippage/volatility on corn
    strike_validation_tolerance_pct: 0.15
  KXBRENTMON:
    extra_min_edge: 0.05 # High variance on monthly Brent wicks
    strike_validation_tolerance_pct: 0.10
  KXHYPE15M:
    extra_min_edge: 0.0 # Widen case for analysis-requested trades

# Optional execution overrides (merged into strategy in compare_historical.py)
# passive + limit_offset_cents: 0 → quote mid (spread squeeze); 1 → bid + 1¢
execution:
  price_strategy: passive # PIVOT: Act as a Maker (Acorns-style) to earn/save the spread
  # Penny-jump: stay at top of queue
  limit_offset_cents: 1 # Tightened for maker priority
  # Force dip-style limits only when very close to expiry
  near_expiry_aggressive_hours: 2.0 
  # Sell held side when net edge (model − bid − maker fee) falls below this floor
  position_exit_min_net_edge: 0.01 
  position_min_hold_minutes: 2 # Faster churn for high volume
  
  # Maker-specific scaling
  layered_order_levels: 5 # Increased from 3 to catch more wicks/volatility
  max_pct_of_book_volume: 0.25 # Don't be more than 25% of the visible book
  
  limit_buy_edge_aggression_enabled: false # Disable 'cross-spread' aggression
  limit_buy_ev_tier_pricing: true
  limit_buy_weak_bid_min_edge: 0.01 # Lowered to increase trade frequency
  limit_buy_medium_quote_mode: mid # PIVOT: Quote the mid-price for better fills as a maker
  # Tier thresholds (cross ≥ near ≥ weak). Align with recovery/strategy min_edge where possible.
  limit_buy_cross_spread_min_edge: 0.02 # MOVED AGGRESSIVELY per feedback (was 0.08)
  limit_buy_near_market_min_edge: 0.02 # (was 0.03)
  # Below this net edge, skip EV cross/near-market aggression (passive/layered only). 0 = off.
  limit_buy_passive_only_below_edge: 0.04 # (was 0.01)
  # Resting BUY: nudge limit +1¢ at each minute threshold (requires open order age from exchange).
  limit_buy_escalation_price_enabled: true
  limit_buy_escalate_after_minutes_1: 1 # Faster (was 2)
  limit_buy_escalate_after_minutes_2: 3 # Faster (was 5)
  # Optional: cancel stale resting BUYs earlier than limit_order_ttl (0 = off). 15 = patience exhausted.
  limit_buy_escalation_cancel_minutes: 5 # Tighter (was 10)
  # Avoid stacking another same-side BUY while an unresolved position exists for that market (platform+ticker+side).
  skip_new_buy_when_unresolved_same_side: true
  # Wide/gapped order books: lift dip-based limits toward bid + anchor×(ask−bid), capped by model fair value;
  # EV-tier quotes also get a touch-lift to at least the bid when fair_cap allows.
  limit_buy_wide_book_coalesce_enabled: true
  limit_buy_wide_book_spread_rel: 0.12 # Tightened (was 0.15)
  limit_buy_wide_book_anchor_fraction: 0.95 # Increased (was 0.90) to improve fill rate on thin books
  limit_buy_wide_book_conservative_substrings: []
  limit_buy_wide_book_conservative_yf_tickers: []

# Optional recovery overlay (merged into strategy before execution merge). Use for low-balance “get gears turning”.
# recovery.min_edge overrides strategy.min_edge (legacy path). With simple_ev on, simple_ev_decision.min_edge is the base gate.
recovery:
  # Merged into strategy.min_edge — keep aligned with simple_ev / strategy min_edge
  min_edge: 0.02 # Lowered to match simple_ev (was 0.08) to capture more volume on small balances
  adaptive_edge_max_extra: 0.0 # 0 = no recent-WR bump while in recovery; when lifting recovery, strategy uses capped extras above
  loss_streak_max_extra: 0.0 # 0 = no streak bump while in recovery; pair with adaptive_learning_enabled when you re-enable
  force_min_buy_contracts_one: true # After budget pass, promote best-edge zero-count BUY to x1 if it fits max_total_buy_pct slice
  # Without these, low min_edge is negated: calibration adds +edge when WR<50%; parity adds up to ~20% on the dominant side.
  calibration_extra_edge_overall: 0.0 # Small penalty for bad history (was 0.02)
  # Looser than 0.07: allow momentum-style “price already above strike” YES without choking fills
  calibration_extra_edge_above_yes: 0.0 # Tightened (was 0.05)
  parity_penalty_enabled: false # Re-enabled to avoid one-sidedness (was true)
  # Empirical CI + vol-disagree: re-enabled so required edge scales with data confidence and thin disagreements can trade.
  uncertainty_edge_mult: 1.5 # (was 0.0) Substantial safety buffer per persistent losses feedback
  trust_circuit_breaker_threshold: 0.15 # Lowered (was 0.3) for more aggressive signal usage
  vol_disagree_extra_edge: 0.0 # Tightened (was 0.03)
  yes_overconfidence_extra_edge: 0.01 # Added small bias correction (was 0)
  # Turn off multipliers that were inflating required edge ~1.08× + DTE scaling on top of CI.
  enable_vol_regime_scaling: true # Re-enabled for risk scaling
  dte_edge_scaling_enabled: true # Re-enabled to prioritize short DTE
  # >1.0 stacks on simple_ev and legacy min_edge for 15m / sub-hour (simple_ev path applies this in compare_historical)
  ultra_short_min_edge_mult: 1.2 # Increased (was 1.0)
  # Hourly / non–5pm crypto (and non–4pm S&P) use strict mode: model P(win) must exceed these AND edge — funding wallets does not change that.
  intraday_other_min_p_win: 0.65 # Tightened (was 0.60)
  intraday_other_min_p_win_with_vol: 0.60 # Tightened (was 0.55)
  # 0 = off. A low strategy cap (e.g. 22¢) drops almost every BUY (69¢ YES / 31¢ NO both fail).
  max_buy_limit_price: 0

# Strategy for compare_historical.py (BUY YES / BUY NO / SKIP)
strategy:
  emergency_stop_reset_time: 1776313500 # RESET: April 16, 2026 (Manual Reset)
  # vol_regime | vol_regime_threshold (aliases): VolRegimeStrategy = DefaultThreshold recommend + vol mults in compare_historical
  strategy_engine: vol_regime
  
  # --- Momentum Sniper (Acorns Strategy) ---
  momentum_sniper_enabled: true
  momentum_sniper_min_ret: 0.005 # 0.5% move required
  momentum_sniper_price_lo: 0.25 # Widened to capture more volume
  momentum_sniper_price_hi: 0.50
  momentum_sniper_edge_bonus: 0.04 # Substantial bonus (4%) for trending markets
  # When simple_ev_decision.enabled is true: single net-edge gate + Kelly sizing; barbell/parity/vol-disagree do not stack on min_edge.
  simple_ev_decision:
    enabled: true
    # Net edge after maker fee; 2% base for higher hurdle (relaxed from 8% to capture more trades)
    min_edge: 0.02
    # No BUY when model P(win) on the bought side is in this band (ambiguous “coin flip” zone).
    skip_p_win_mid_band_enabled: false # Disabled to allow more trades
    skip_p_win_mid_lo: 0.42
    skip_p_win_mid_hi: 0.58
    # New proposed fields:
    no_trade_zone_width: 0.05
    buy_no_extra_min_edge: 0.03
    # 0–10¢ legs must clear this net edge (blocks weak edge at penny prices; 0 = off).

    cheap_band_price_lo: 0.00
    cheap_band_price_hi: 0.10
    cheap_band_min_net_edge: 0.04 # Relaxed further to capture high-edge lottery trades (was 0.06)
    kelly_dampen: 0.15 # Reduced (was 0.10)
    max_bankroll_fraction: 0.08 # Increased (was 0.05)
    # Strong-edge sizing: when net edge clears this, multiply spend fraction (still bounded by max_bankroll_fraction).
    edge_size_boost_edge: 0.10 # (was 0.15)
    edge_size_boost_mult: 1.5 # (was 1.2)
    spread_wide_fraction: 0.15 # Relaxed
    spread_wide_size_mult: 0.5
    # Multiply simple-EV spend fraction on 15m / sub-hour (1.0 = unchanged). Compensates for same Kelly path on fast markets.
    ultra_short_size_mult: 0.8 # (was 0.5)
    emp_vol_disagree_threshold: 0.15 # Relaxed
    disagree_size_mult: 0.5
    calibration_win_rate_threshold: 0.40 # Relaxed
    calibration_poor_size_mult: 0.7
    min_bid_size: 0 # Hard skip when visible bid size below this; 0 = use min_order_book_depth only
  # Dynamic edge by price band: require higher edge for 'coin flip' zones (40-60c) or weak bands.
  tiered_min_edge:
    enabled: true
    min_edge: 0.02 # Relaxed to capture more volume (was 0.08)
    bands:
      - { lo: 0.00, hi: 0.02, min_edge: 0.15 } # (was 0.25)
      - { lo: 0.02, hi: 0.15, min_edge: 0.10 } # (was 0.20)
      - { lo: 0.15, hi: 0.40, min_edge: 0.05 } # (was 0.15)
      - { lo: 0.40, hi: 0.65, min_edge: 0.08 } # (was 0.20)
      - { lo: 0.65, hi: 1.00, min_edge: 0.05 } # (was 0.15)
  # Log final required edges: simple mode prints the single gate; legacy prints stacked core + req_yes/req_no.
  log_effective_min_edge: true
  # One JSON line per market with p pipeline, net edges, required hurdles, regime mults (grep decision_diag:).
  log_decision_diagnostics: true # ENABLED for live calibration test: captures P-shifts for analysis
  # When true: drop pending BUYs whose win range does not overlap an already-kept bet (same yf+resolution+platform).
  # Default false — true blocked many valid multi-strike edges (e.g. INXU hourly ladder) for disjoint ranges.
  filter_disjoint_underlying_buys: false
  # Base min_edge (overridden by recovery.min_edge when set). Net edge after fees: model P − market − fee must clear this.
  # Used when simple_ev_decision.enabled is false. With simple EV on, simple_ev_decision.min_edge is the active gate.
  min_edge: 0.02 # Tightened from 0.15
  # Barbell: only "base" (high-P consensus) or "alpha" (cheap + large net edge after fees); middle-priced edges skipped.
  # Off while simple_ev_decision is primary — avoids subtle double-routing; re-enable after baseline is stable.
  barbell_enabled: true # Re-enabled for conservative consensus (was false)
  barbell_base_min_market_yes: 0.75 # Market bid on the side we buy must be ≥ this (YES bid for BUY YES, NO bid for BUY NO)
  barbell_base_min_model_p: 0.85 # Model P(win) on that side must be ≥ this
  barbell_base_max_model_vs_market_gap: 0.05 # Require model P ≥ market bid − gap (consensus / not fighting tape)
  barbell_base_max_yes_price: 0.94 # Tightened
  barbell_base_max_no_price: 0.94 # Tightened
  barbell_alpha_max_cheap_price: 0.15 # Alpha leg: market bid ≤ this
  barbell_alpha_min_model_p: 0.35 # Alpha: model P(win) floor on bought side
  barbell_alpha_min_net_edge: 0.20 # Alpha: net edge floor (was 0.15)
  barbell_base_kelly_mult: 0.8 # Reduced sizing
  barbell_alpha_kelly_mult: 0.05 # Much smaller sizing for lottery / mispricing tail
  # Easy win: helps base-layer high-P trades clear edge after fees (paired with barbell base)
  enable_easy_win: true
  min_edge_easy_win: 0.03 # Must stay <= strategy.min_edge (was 0.02)
  easy_win_min_p_win: 0.90 # Tightened (was 0.85)
  easy_win_min_market_p: 0.75 # Tightened (was 0.70)
  # Consensus sniper: when barbell is on, trades matching barbell_base_* use this net-edge hurdle (can be slightly negative to absorb maker fee when p≈bid)
  consensus_sniper_enabled: true
  consensus_sniper_min_edge: 0.0 # No longer allowing negative edge (was -0.01)
  # Strict intraday / ultra-short used recommend_strict without easy-win or sniper — barbell “base” could never clear.
  barbell_soften_strict_intraday: false # Tightened to strict (was true)
  barbell_strict_relaxed_min_p_win: 0.80 # Tightened (was 0.72)
  min_yes_price: 0.02 # Skip BUY YES below 2¢ (was 1¢)
  # Steamroller guard: above this YES bid, only barbell-base (or skip). Align with max_buy_limit_price for expensive consensus trades.
  max_yes_price_for_buy: 0.80 # Tightened (was 0.85)
  # Hard cap on limit price for any proposed BUY (YES or NO). Blocks 99¢ NO "nickels in front of steamroller" on micro balance. 0 = off
  # Cap on bought-leg limit; 0 = disabled. Use max_yes_price_for_buy + min_payout_ratio for steamroller control.
  # 0.22 blocked nearly all real markets (any YES/NO quote above 22¢); too aggressive for normal execution.
  max_buy_limit_price: 0.80 # Tightened (was 0.85)
  # Min (profit if win / stake) on limit price = (1−price)/price. Must be ≤ (1−max_buy_limit_price)/max_buy_limit_price or high-price fills are dropped.
  min_payout_ratio: 0.20 # Higher floor (was 0.10)
  # Scale required edge by DTE: easier <~24h, harder >~3d (prioritize “hot” zone)
  dte_edge_scaling_enabled: true # Re-enabled (was false)
  dte_edge_short_threshold_days: 1.0
  dte_edge_long_threshold_days: 3.0
  dte_edge_mult_short: 0.85 # More discount for hot zone
  dte_edge_mult_long: 1.25 # More penalty for distant zones
  max_new_buy_dte_days: 14 # Added 14d cap (was 0)
  yes_overconfidence_extra_edge: 0.01 # Re-enabled (was 0)
  model_probability_shrinkage: 0.6 # Global humility (was 0.8) for predicted edges
  # Prefer strikes within ~15% of spot (tightened from 25%)
  max_buy_yes_strike_above_pct: 0.15 
  max_buy_no_strike_above_pct: 0.15 
  min_no_price: 0.02 # Skip BUY NO when NO bid < 2¢ (was 1¢)
  days_back: 730 # ~2y historical for P(above/below); launchd passes --days 730 to match
  days_to_expiry: 30 # For volatility model (log-normal)
  skip_buy_no_above_cushion: 0.01 # Threshold still computed, but enforcement is controlled by enforce_no_above_rule
  # Force exploration: if no trades (fills) in 2h, temporarily reduce min_edge by 30%
  force_exploration_reduction: 0.0 # Disabled penalty (was 0.30)
  force_exploration_hours: 2.0
  # Balance-aware Survival Mode (Tuning for ~$5 accounts)
  starting_balance_cents: 2500 # Treat $25 as the nominal starting point for regime ratios (was $100)
  balance_regime_low_ratio: 0.05 # Entry to survival at $1.25 (was 0.3 or $30)
  balance_regime_medium_ratio: 0.20 # Entry to caution at $5.00 (was 0.5 or $50)
  balance_regime_low_min_edge_add: 0.02 # Relaxed survival penalty (was 0.10)
  balance_regime_medium_min_edge_add: 0.01 # (was 0.05)
  balance_regime_low_kelly_mult: 0.5 # Less aggressive deleveraging in survival (was 0.1)
  min_bet_size_bankroll_pct: 0.001 # 0.1% of $5 is 0.5 cents; allows $0.15 contracts to clear budget (was 0.5%)
  # Dynamic series hurdles (replaces hard Paper-Only block)
  series_hurdle_enabled: true
  series_hurdle_paper_penalty: 0.10 # Add 10% edge req for poor performers
  series_hurdle_trusted_bonus: 0.05 # Reduce 5% edge req for proven performers
  series_trusted_min_win_rate: 0.65
  series_trusted_min_samples: 5
  
  # Series Guard thresholds (for Paper-Only status)
  series_guard_min_win_rate: 0.25
  series_guard_max_consecutive_losses: 5
  series_guard_lookback_hours: 24.0
  series_guard_reset_time: 1777660455 # RESET: May 1, 2026 (Now)
  # Market probability filters (skip deep OTM/ITM tails)
  market_prob_lo: 0.01 # RELAXED (was 0.05) to capture high-edge tail signals
  market_prob_hi: 0.99 # RELAXED (was 0.95)
  # Max contracts per underlying in a single evaluation run (forced diversification)
  max_contracts_per_underlying: 25 # Increased for Acorns-style volume (was 5)
  # Refined strategy params from agent review
  taker_edge_threshold: 0.15 # Aggressive liquidity taking (was 0.20)
  # Aggression scaling: reduce taker threshold by this mult * (edge - min_edge)
  # e.g. 0.5 mult means if we have 25% edge vs 15% hurdle, threshold drops by 0.5 * 0.10 = 5% (to 0.15)
  edge_aggression_scaling: 0.5
  ultra_short_k_spread: 0.6 # Increased sensitivity to spread
  ultra_short_latency_risk: 0.02 # Increased baseline risk
  sell_losing_pct: 0.65 # Tightened exit (was 0.55)
  dynamic_sell_threshold: true # EV-optimal: sell when P(lose) > 1 - (bid - exit_fee). Adapts threshold to current bid price.
  # Anti–paper-hands: mean-reversion + EV exits only when very wrong; ITM winners often held to expiry window.
  # STOP_LOSS and REC_RULE_VIOLATION still sell — this blocks flip + REC_LIKELY_LOSE on strong winners.
  # Flip sell only when held-side model edge vs bid is worse than -buffer (higher = rarer flip sells).
  position_flip_sell_min_negative_edge: 0.15 # Tightened exit (was 0.20)
  # Add to dynamic/fixed P(lose) sell threshold — need model much more “sure you’ll lose” before exiting.
  position_loser_sell_p_lose_margin: 0.08 # Tightened exit (was 0.12)
  # Skip discretionary sells when spot is comfortably ITM vs strike and DTE is within max (days).
  hold_winner_to_expiry_enabled: true
  hold_winner_min_spot_vs_strike_pct: 0.10 # Tightened (was 0.06)
  hold_winner_max_dte_days: 1.0 # Reduced protection window (was 3d)
  aggressive_limit_orders: true # Place deep limit orders on all buys; worst case = no fill = no fee (platform cancels unfilled)
  # Micro-balance: avoid paying the spread — quote mid or bid+1¢ instead of deep dip (see compare_historical passive limits)
  passive_limit_quote: bid_plus_tick # overridden by execution.limit_offset_cents≥1 → same; dip|mid for deeper passive
  # Empirical P(above/below): exponential weights recent bars (crypto regime shifts); step_recent = legacy flat window
  empirical_weighting: exponential # step_recent | exponential
  empirical_exponential_halflife_bars: 4 # Faster memory (was 6)
  # Multi-horizon empirical blend: 0.5×short + 0.3×medium + 0.2×long (same exp weighting each)
  empirical_multi_horizon_enabled: true
  empirical_horizon_short_days: 14 # Faster response (was 21)
  empirical_horizon_medium_days: 60 # (was 90)
  empirical_horizon_long_days: 180 # (was 365)
  empirical_horizon_w_short: 0.6 # More weight to short (was 0.5)
  empirical_horizon_w_medium: 0.3
  empirical_horizon_w_long: 0.1
  # Hard cap blended model P before edge/Kelly (100% vol P → full Kelly is unsafe on $5 bankroll)
  enable_model_prob_hard_cap: true
  model_prob_hard_lo: 0.05 # Increased floor (was 0.01)
  model_prob_hard_hi: 0.85 # INCREASED (was 0.70) per feedback to allow ITM trades
  max_dip_cap: 0.01 # Tightened (was 0.03)
  limit_dip_pct: 0.02 # WIDENED (was 0.005) per feedback to catch more fills
  limit_order_mode: layered # fixed_pct | dynamic_tick | layered
  tick_offset: 1 # Penny-jump one tick above best bid when mode uses dynamic ticks
  max_inventory_skew_pct: 0.05 # Tightened (was 0.10)
  # 0 = skip mid-price stability guard (more live limit / lottery / dip orders; relies on other risk gates).
  # Set back to 10–15 if you see churn or want anti-sniping from DB snapshots again.
  min_stability_duration_seconds: 5 # Re-enabled small stability guard
  # PnL: depth floor (vol-scaled in compare_historical). 15 + max_pct_of_book_volume caps adverse selection vs blind 10.
  min_order_book_depth: 20 # Increased (was 10)
  # PnL: Skip trades where (ask - bid) / bid > this cap (prevents trading in illiquid/toxic books).
  max_spread_pct: 0.18 # Tightened from 0.25 based on desk-style feedback (<20%)
  # PnL: Don't re-enter a ticker/side for N hours after a STOP_LOSS exit (anti-revenge trading).
  stop_loss_cooldown_hours: 12.0 # Increased (was 4)
  # PnL: cap each BUY clip to this fraction of visible same-side bid size (0 = off)
  max_pct_of_book_volume: 0.25 # Reduced (was 0.50)
  cancel_on_vol_spike: true # Cancel resting BUY limits and block new BUY limits while vol-spike safety is active
  cancel_all_on_regime_shift: true # During momentum crash or vol-spike regime, cancel resting BUY limits before re-quoting
  limit_order_ttl_minutes: 15 # Faster rotation (was 30)
  # Passive bid chase: if still recommended, cancel resting BUY after N minutes so next cycle re-quotes at fresh bid
  passive_bid_chase_enabled: true
  passive_bid_chase_refresh_minutes: 2 # Faster chase (was 3)
  near_expiry_keep_dte: 0.02 # Don't cancel resting BUY limits for want_better_price when DTE < this (~30 min)
  max_entries_per_ticker: 2 # Reduced (was 3)
  # Sum of unresolved contract count per (platform, Yahoo underlying), e.g. all BTC-USD Gemini legs share one bucket. 0 = off.
  max_open_contracts_per_underlying: 20 # Tightened (was 50)
  # Optional separate cap for ultra-short horizons (15m tickers / DTE <= ultra_short_dte_hours). 0 = use base cap only.
  # Modest +20% vs base so 15m can still get entries when longer-dated legs fill the bucket; same yf_ticker shares one open sum.
  max_open_contracts_per_underlying_ultra_short: 25
  layered_order_levels: 3 # Reduced (was 4)
  limit_dip_pct_high_confidence: 0.00 # High P(win): bid the tape (was 0.01)
  limit_dip_pct_price_decline: 0.01 # (was 0.02)
  # DTE-confidence dip scaling: when resolution is far out AND model is confident,
  # place deeper limit orders to catch uncertainty-driven price dips.
  # Markets with distant resolution are prone to mean-reverting dips even when
  # the eventual outcome is near-certain; deeper limits capture these.
  far_dte_dip_scaling_enabled: true # Enable DTE-proportional limit dip scaling
  far_dte_threshold_days: 0.028 # ~40 min; lower to allow dip scaling on intraday (was 0.042=1h; XRP 47min was blocked)
  far_dte_dip_scale_per_day: 0.02 # (was 0.015)
  far_dte_max_extra_dip: 0.12 # (was 0.18)
  far_dte_min_confidence: 0.85 # (was 0.80)
  far_dte_confidence_boost: 1.2 # (was 1.5)
  # Disagreement dip: when model and market strongly disagree (e.g. market 95%, we 45%), place low limit order to catch dips
  enable_disagreement_dip: true # Place limit orders below bid when |hist_p - market_yes| >= min_gap
  disagreement_dip_min_gap: 0.35 # (was 0.25)
  disagreement_dip_min_p_win: 0.35 # (was 0.25)
  disagreement_dip_pct_of_bid: 0.40 # (was 0.50)
  disagreement_dip_min_price: 0.05 # Aligned with min_yes/min_no — no sub-5¢ dip fishing
  disagreement_dip_max_price: 0.12 # (was 0.15)
  disagreement_dip_contracts: 1 # (was 2)
  # Lottery limits on SKIP + very high model P(win): use penny_jump so bid is best_bid+1¢ (cheap legs capped)
  enable_lottery_limits: true
  lottery_limit_min_p_win: 0.995 # (was 0.99)
  lottery_limit_price_mode: penny_jump # fixed | penny_jump — jump beats 1¢ stink bids when the book is 3–7¢
  lottery_limit_price: 0.01 # used when mode=fixed
  lottery_limit_max_price: 0.05 # (was 0.10)
  lottery_penny_jump_apply_cap_bid_below: 0.15 # (was 0.22)
  lottery_limit_contracts: 1
  # Optional: only place lottery when market YES is in ATM band (more churn / fills; turns off “sure thing” penny NO lotteries)
  lottery_market_yes_band_enabled: true
  lottery_market_yes_band_lo: 0.45 # (was 0.40)
  lottery_market_yes_band_hi: 0.55 # (was 0.60)
  vol_blend_weight: 0.40 # Increased vol weight (was 0.30)
  use_intraday_empirical: true # Use yfinance 1h data for empirical P on intraday (5pm crypto, 4pm S&P). False = pure vol model for intraday.
  use_ewma_vol: true # Use EWMA for time-varying vol instead of sample variance. Better for regime changes.
  ewma_lambda: 0.90 # (was 0.94)
  intraday_ewma_lambda: 0.85 # (was 0.90)
  vol_model: auto # auto|ewma|garch|sample. auto uses GARCH(1,1) when available, then falls back safely.
  garch_min_returns: 80 # Minimum return observations before enabling GARCH fit in auto/garch mode
  intraday_other_min_p_win: 0.65 # (was 0.60)
  intraday_other_min_p_win_with_vol: 0.60 # (was 0.55)
  # Sub-hour / 15m (Kalshi KX*15M e.g. KXBTC15M/KXDOGE15M, Gemini *15M* tickers, or DTE <= ultra_short_dte_hours)
  ultra_short_dte_hours: 1.2 # ENABLED: Detect markets resolving within 72 minutes as ultra-short
  ultra_short_min_p_win: 0.55 # relaxed to allow 55–65% confidence edges on ultra-short contracts
  ultra_short_min_p_win_with_vol: 0.52 # relaxed vol-path gate for ultra-short contracts
  # 15m / sub-hour: extra × on required min_edge (settable here; code default is 1.0)
  ultra_short_min_edge_mult: 1.5 # Require 50% more edge for ultra-short contracts
  # When time-to-resolution is under this many minutes, multiply required net edge again (late books more efficient).
  ultra_short_late_minutes_threshold: 5.0 # (was 3.0)
  ultra_short_late_min_edge_mult: 1.2 # (was 1.0)
  # Fees: Kalshi & Gemini both use maker fee = rate × P × (1−P) per contract (rounded up to 1¢)
  kalshi_maker_fee_rate: 0.0175 # 1.75% maker. min_edge is net edge after fees (e.g. 0.01 = 1¢ profit per contract)
  kalshi_sp500_maker_fee_rate: 0.00875 # Lower fee assumption for S&P 500-style index markets
  gemini_maker_fee_rate: 0.0175 # 1.75% maker; same formula as Kalshi
  min_fee_per_order: 0.01 # Fee floor used in edge math for small orders/contracts
  # Systematic edges (QuantPedia: arbitrage, cross-platform hedging)
  min_arb_fee: 0.05 # (was 0.02)
  enable_intra_arb: true # Intra-exchange: buy YES+NO when sum < 1 (same market)
  enable_inter_arb: true # Inter-exchange: buy YES on one platform + NO on other when sum < 1 (Kalshi/Gemini hedge)
  arb_inter_require_group_preflight: true # Require both inter-arb legs to pass shared balance preflight before BUY execution
  inter_arb_balance_aware_routing: true # Prefer inter-arb route that keeps cheaper leg on lower-balance account while preserving arb
  arb_inter_allow_single_leg_fallback: false # Paired inter-arb only — avoids naked directional leg when one venue can't fund
  # Absolute winner: when buying very cheap (e.g. 1¢) on near-certainty (P≥95%), buy more contracts
  absolute_winner_min_p_win: 0.98 # (was 0.95)
  absolute_winner_max_price: 0.03 # (was 0.05)
  absolute_winner_max_pct_of_balance: 0.01 # (was 0.02)
  absolute_winner_max_contracts: 100 # (was 500)
  # Calibration: use historical prediction outcomes to improve recommendations (FreqAI-style)
  use_calibration: true # Consult resolved predictions; disable favor-YES when "above+YES" underperforms
  favor_yes_when_above_strike: true # RE-ENABLED (was false) to capture ITM momentum on YES
  enforce_no_above_rule: false # DISABLED (was true) to allow YES buys when price is already above strike
  min_calibration_samples: 5 # Min resolved "above+YES" trades before applying calibration penalty
  calibration_min_win_rate_above_yes: 0.65 # (was 0.55)
  calibration_extra_edge_above_yes: 0.0 # (was 0.03)
  # Hard block BUY YES on "above" only when slice WR is bad *and* avg entry is expensive
  # (cheap long-shots can show low WR while still EV+; do not block those).
  calibration_hard_block_above_yes_win_rate: 0.35 # (was 0.24)
  calibration_hard_block_above_yes_min_samples: 20 # (was 40)
  calibration_hard_block_above_yes_min_avg_entry: 0.25 # (was 0.36)
  calibration_min_date: "2026-04-15" # use only recent resolved history for trust/calibration fitting
  calibration_extra_edge_overall: 0.0 # (was 0.0)
  min_calibration_samples_overall: 10 # (was 20)
  use_bucket_penalty: true # Re-enabled to address non-monotonic edge with high override weight
  bucket_override_weight: 0.7 # (was 0.5) More aggressive blend with empirical reality to fix non-monotonic edge
  min_bucket_samples: 5 # Reduced to allow faster adaptation
  min_vol_confidence_far_otm: 0.92 # (was 0.88)
  calibration_loss_weight: 2.0 # (was 1.5)
  enable_sell_and_rebuy: false # Off by default — reduces fee churn and re-entry into the same bad tick on fast markets
  # P(lose) blend: incorporate market odds; weight increases as we approach resolution (markets more accurate near expiry)
  p_lose_blend_market_max_weight: 0.7 # (was 0.5)
  p_lose_blend_market_half_life_days: 0.25 # (was 0.5)
  use_kelly: true # Kelly criterion for position sizing — reduces size for farther-OTM contracts (lower P(win))
  kelly_fraction: 0.05 # Increased from 0.01 to allow meaningful bet sizes

  dynamic_kelly_enabled: true # Adapt Kelly down when calibration quality degrades
  dynamic_kelly_floor: 0.01 # (was 0.02)
  dynamic_kelly_stress_fraction: 0.01 # (was 0.03)
  dynamic_kelly_stress_win_rate: 0.50 # (was 0.45)
  dynamic_kelly_recovery_win_rate: 0.60 # (was 0.55)
  # Per-venue circuit breaker: Kalshi realized PnL vs Kalshi balance; Gemini vs Gemini — independent.
  # Not win-rate based — trips when losses eat too much of that venue's balance (e.g. 20% in 8h).
  adaptive_loss_block_max_balance_loss_pct: 0.50 # INCREASED SIGNIFICANTLY (was 0.10) to avoid drawdown halts on micro-balances
  adaptive_loss_block_lookback_hours: 4.0 # (was 12.0)
  adaptive_loss_block_min_trades: 3 # (was 5)
  adaptive_execution_fill_rate_target: 0.12 # Raise fill-rate target; below this bot tightens limits toward tape
  adaptive_execution_min_dip_multiplier: 0.10 # Allow much more aggression than old hard floor 0.20
  drawdown_stop_trading_pct: 0.50 # Avoid constant halts on tiny wallets; still hard-stops at 50% drawdown in window
  drawdown_cooldown_hours: 6.0 # Shorten drawdown lookback so old losses decay faster after reset
  risk_balance_floor_cents: 2500 # Treat balances below $25 as $25 for loss % calculations to prevent micro-balance lockout
  enable_two_sided_quotes: false # Temporarily disable symmetric YES/NO quotes while performance stabilizes
  two_sided_quote_min_edge: 0.05 # (was 0.02)
  macro_signal_enabled: true # Include macro cross-asset context in signal model
  macro_signal_tickers: ["SPY", "UUP", "GLD"] # Added Gold
  use_live_price: true # Blend live + closes[-1] for vol model + safety; reflects sharp moves (e.g. last 10 min)
  live_price_weight: 0.8 # (was 0.6)
  empirical_use_rolling_window: true # Empirical model uses rolling window for faster adaptation
  empirical_recent_days: 60 # (was 90)
  # When overall calibration WR is poor, shorten effective rolling window (regime-shift response)
  empirical_stress_recent_days: 30 # (was 45)
  empirical_stress_calibration_max_wr: 0.45 # (was 0.42)
  empirical_stress_min_samples: 20 # (was 30)
  empirical_recent_weight: 5.0 # (was 3.0)
  use_volatility_by_default: true # Use volatility model even without --use-volatility
  vol_dynamic_n0: 60 # (was 90)
  uncertainty_edge_mult: 1.5 # (was 0.0) Match strategy section
  stop_loss_pct: 0.25 # (was 0.35)
  # Book stop is still triggered by Kalshi bid vs entry; these only gate *when* it may fire:
  stop_loss_spot_itm_min_pct: 0.02 # (was 0.01)
  stop_loss_book_persist_seconds: 45 # (was 60)
  # Counter-trend book stops exit faster; with-trend stops tolerate weak book longer (not a global loosen-all)
  stop_loss_regime_persist_enabled: true
  stop_loss_book_persist_counter_trend_seconds: 30 # (was 45)
  stop_loss_book_persist_trend_aligned_seconds: 60 # (was 90)
  # Near-expiry (hours to resolution < window): widen book stop + multiply persistence. Set hard_disable for legacy “no stops”.
  stop_loss_near_expiry_within_hours: 0 # 0 = off; or use legacy stop_loss_disable_within_hours if this key omitted
  stop_loss_near_expiry_extra_pct: 0.08 # (was 0.12)
  stop_loss_near_expiry_persist_mult: 1.5 # (was 2.0)
  stop_loss_near_expiry_hard_disable: false # If true, block all book stops inside window (old behavior)
  # Linear gradient: effective stop += min(max_extra, per_edge * favorable_spot_edge); 0 max_extra or per_edge = off
  stop_loss_gradient_max_extra_pct: 0.15 # (was 0.25)
  stop_loss_gradient_per_edge: 5.0 # (was 10.0)
  stop_loss_disable_within_hours: 0 # Legacy: only used when stop_loss_near_expiry_within_hours is not set in YAML
  weekend_edge_multiplier: 1.3 # (was 1.1)
  enable_momentum_protection: true # Skip BUY YES during sharp downside momentum
  momentum_crash_threshold_pct: -0.08 # (was -0.15)
  max_cross_platform_exposure: 0.25 # (was 0.40)
  # Bankroll-% caps on this batch’s pending BUY notionals (Kalshi+Gemini combined); trims worst edge/efficiency first.
  max_bankroll_fraction_per_underlying: 0.20 # (was 0.40)
  max_bankroll_fraction_per_direction: 0.15 # (was 0.30)
  max_daily_loss_pct: 0.25 # Relaxed to allow for higher volume/variance
  max_daily_loss_cents: 500 # Increased $5 cap
  enable_vol_spike_safety: true # Re-enabled (was false)
  vol_spike_threshold_mult: 2.5 # (was 3.0)
  vol_spike_edge_multiplier: 1.5 # (was 2.0)
  enable_defensive_mode: false # Re-enabled (was false)
  defensive_vol_ratio_threshold: 3.5 # (was 2.0)
  enable_dynamic_stability_window: true # Scale stability guard window with volatility regime (ATR/vol ratio proxy)
  stability_vol_ratio_ref: 1.0 # Vol-ratio reference where stability multiplier starts from 1x
  stability_max_multiplier: 10.0 # Cap on dynamic stability-window expansion in extreme volatility
  enable_vol_regime_scaling: true # Re-enabled (was false)
  vol_regime_edge_mult_per_x: 0.5 # (was 0.35)
  vol_regime_max_edge_mult: 3.0 # (was 2.5)
  vol_regime_dip_mult_per_x: 0.7 # (was 0.5)
  vol_regime_max_dip_mult: 3.0 # (was 2.0)
  vol_regime_size_mult_per_x: 0.7 # (was 0.5)
  vol_regime_min_size_mult: 0.2 # (was 0.35)
  enable_cross_exchange_sanity_gate: true # Block stale-side buys when one venue lags repricing during sharp spot moves
  cross_exchange_max_yes_gap: 0.08 # (was 0.15)
  cross_exchange_spot_move_threshold_pct: 0.02 # (was 0.05)
  parity_penalty_enabled: false # Re-enabled (was false)
  parity_lookback_days: 14 # INCREASED (was 7) per feedback to reduce volatility
  parity_base_penalty: 0.05 # (was 0.025)
  parity_max_penalty: 0.25 # (was 0.16)
  enable_strike_validation: true # Cross-check extracted strike against current price + market odds
  strike_validation_tolerance_pct: 0.15 # (was 0.25)
  enable_otm_smile_adjustment: true # Volatility smile proxy: boost vol for OTM strikes to avoid underestimating tails
  otm_smile_strength: 0.5 # (was 0.35)
  otm_smile_max_mult: 3.0 # (was 2.0)
  vol_distribution: student_t # Heavy-tail volatility distribution: normal or student_t
  vol_t_df: 3.5 # Fatter tails (was 4.5)
  vol_disagree_threshold: 0.20 # (was 0.30)
  vol_disagree_extra_edge: 0.0 # (was 0.02)
  vol_disagree_dampen_blend: 0.3 # (was 0.5)
  # When emp and vol *both* sit very high, disagreement logic never fires — pull blend toward 50% (PnL / overconfidence)
  joint_high_confidence_enabled: true
  joint_high_emp_vol_threshold: 0.85 # (was 0.88)
  joint_high_pull_to_half: 0.25 # (was 0.12)
  intraday_vol_cap: 0.90 # (was 0.98)
  intraday_min_empirical_weight: 0.30 # (was 0.20)

  # --- Adaptive learning: the bot learns from its own recent trades ---
  # When re-enabled, softer caps than legacy defaults avoid a ~25–35% stacked hurdle (recent WR + streak + EWMA).
  adaptive_learning_enabled: true # Re-enabled for volume (was false)
  adaptive_edge_lookback_hours: 12.0 # (was 6.0)
  adaptive_edge_min_trades: 5 # (was 8)
  # Win-rate shortfall must exceed this t-stat vs 50% (rough two-sided test); also skips bump if window PnL ≥ 0.
  adaptive_edge_confidence_t_stat: 1.2 # (was 1.5)
  adaptive_edge_scale_per_pct: 0.005 # (was 0.002)
  adaptive_edge_max_extra: 0.03 # Capped penalty for bad recent performance (was 0.10)
  loss_streak_threshold: 3 # (was 5)
  loss_streak_extra_edge: 0.05 # (was 0.03)
  # Trust-the-model: lower = milder compounding on long streaks
  adaptive_loss_streak_step: 0.15 # (was 0.08)
  loss_streak_max_extra: 0.08 # (was 0.04)
  series_cooldown_threshold: 3 # (was 4)
  series_cooldown_extra_edge: 0.06 # (was 0.04)
  ewma_halflife_trades: 20 # (was 30)
  ewma_edge_scale_per_pct: 0.003 # (was 0.001)
  # Decay adaptive edge bump when no resolutions for a while; shrink Kelly when bump is large (if adaptive re-enabled)
  adaptive_edge_idle_decay_start_hours: 1.0 # (was 2.5)
  adaptive_edge_idle_decay_halflife_hours: 5.0 # (was 10.0)
  adaptive_stress_size_edge_threshold: 0.05 # (was 0.06)
  adaptive_stress_size_min_mult: 0.4 # (was 0.58)

  mc_enabled: true # Monte Carlo simulation: blend simulated paths with analytical CDF for tail-aware probability
  mc_paths: 15000 # (was 10000)
  mc_blend_weight: 0.5 # (was 0.38)
  liquidity_spread_bps_soft: 1000 # (was 1200)
  liquidity_spread_bps_hard: 2500 # (was 3500)
  liquidity_min_size_multiplier: 0.1 # (was 0.2)
  liquidity_missing_ask_multiplier: 0.5 # (was 0.8)
  # ML/AI-style signal model: combine multiple signals into a unified P(YES)
  enable_signal_model: true # Use weighted feature model on top of empirical/volatility signals
  market_relative_scoring_enabled: true # EDGE MODEL: predict (outcome - market_prob) instead of absolute P
  ensemble_scoring_enabled: true # Use multiple weight sets and uncertainty gating
  use_sklearn_calibration: true # Fit calibrator from resolved predictions (hist_p -> outcome)
  sklearn_calibration_method: platt # isotonic or platt
  sklearn_calibration_min_samples: 100 # (was 50)
  enable_auto_signal_weight_fit: true # Learn signal-model feature weights from resolved predictions
  signal_weight_fit_min_samples: 100 # (was 150)
  signal_weight_fit_l2_c: 0.5 # (was 1.0)
  signal_model_weights:
    bias: 0.0
    emp_p: 1.0 # REDUCED (was 1.2): focus on higher-confidence signals
    vol_p: 1.0 # INCREASED (was 0.8)
    market_yes: 0.85 # INCREASED (was 0.7): trust market price more to dampen overconfidence
    edge_yes: 0.7 # REDUCED (was 0.8)
    edge_no: -0.3 # REDUCED (was -0.4)
    moneyness: 0.3
    dte_norm: 0.2
    spread_norm: -1.5 # INCREASED PENALTY (was -1.2)
    liquidity_consistency: 0.8 # INCREASED (was 0.7)
    rsi_norm: -0.4
    vwap_dist: 0.5
    price_trend: 0.4 # (was 0.3)
  signal_model_ensemble_weights:
    - name: "Conservative Consensus"
      weights:
        emp_p: 1.2
        vol_p: 1.2
        market_yes: 1.2
        liquidity_consistency: 1.2
        spread_norm: -1.5
    - name: "Alpha Residual"
      weights:
        edge_yes: 1.2
        edge_no: -0.8
        vwap_dist: 1.2
        price_trend: 1.0
        spread_norm: -1.0
        rsi_norm: -0.8
  # Anti-hallucination layers: reduce model overconfidence vs market reality
  anti_hallucination:
    bayesian_enabled: true # RE-ENABLED (was false) to fix overconfidence engine
    bayesian_market_strength: 15.0 # INCREASED (was 10.0) to trust market more
    
    # Linear Market Blend: final_p = (1-w)*market + w*model
    market_blend_enabled: true
    market_blend_model_weight: 0.20 # 80% market, 20% model tilt (as suggested by user)
    
    ewma_prob_enabled: true # EWMA probability: weight recent data exponentially
    ewma_prob_span: 10 # Faster response (was 14)
    ewma_prob_min_samples: 5 # (was 10)
    ewma_prob_blend_weight: 0.40 # INCREASED (was 0.35)
    vol_zscore_enabled: true # Vol Z-score gate: dampen confidence during vol spikes
    vol_zscore_short_window: 12 # (was 24)
    vol_zscore_long_window: 168 # Long vol window (bars) for baseline
    vol_zscore_threshold: 1.2 # TIGHTENED (was 1.5)
    vol_zscore_tail_mult: 0.4 # TIGHTENED (was 0.5)
    adaptive_edge_enabled: true # Re-enabled
    adaptive_edge_cheap_threshold: 0.35 # (was 0.40)
    adaptive_edge_expensive_threshold: 0.65 # (was 0.60)
    adaptive_edge_otm_base_mult: 2.5 # (was 1.8)
    adaptive_edge_trend_opposed_mult: 2.0 # (was 1.5)
    adaptive_edge_strike_dist_mult: 1.5 # (was 1.2)
    regime_filter_enabled: true # RE-ENABLED (was false) to master switch for regime + BUY NO momentum gates
  # Surgical kill switch: oil uptrend NO ban + per-series size haircut on bad 7d PnL (not blanket blacklist)
  dynamic_kill_switch:
    enabled: true
    oil_series_prefix: KXWTI
    oil_block_buy_no_uptrend: true
    series_pnl_lookback_hours: 168
    pnl_cents_floor: -500 # −$20 in window (was -$50)
    min_trades: 2 # (was 3)
    poor_pnl_size_mult: 0.3 # (was 0.5)
  # Alpha engine: OBI, markout PnL, vol-adjusted Kelly, lead-lag signal
  alpha_engine:
    obi_enabled: true # Order Book Imbalance: directional signal from bid/ask depth
    obi_edge_bonus_max: 0.02 # Max edge reduction when OBI strongly favors our direction (was 0.04; PM books are thin)
    obi_strong_threshold: 0.40 # OBI magnitude above which signal is actionable
    obi_min_total_size: 5.0 # Minimum combined bid+ask size for OBI to be valid
    markout_enabled: true # Toxic flow detection: track post-fill adverse selection
    markout_windows_minutes: [1, 5, 15] # Time windows (minutes) for markout PnL measurement
    markout_toxic_threshold_bps: -50.0 # Avg markout below this → ticker is toxic (adverse selection)
    markout_edge_penalty: 0.03 # Extra edge required for tickers flagged as toxic
    markout_min_samples: 5 # Min fills before toxic flow detection activates
    vol_kelly_enabled: true # Volatility-adjusted Kelly: shrink position size in high-vol regimes
    vol_kelly_baseline_vol: 0.02 # "Normal" vol level; Kelly unchanged at this level
    vol_kelly_max_shrink: 0.25 # Floor: Kelly never shrinks below 25% of base in extreme vol
    vol_kelly_lookback_bars: 24 # Bars of recent closes to compute current realized vol
    lead_lag_enabled: true # Lead-lag signal: use correlated asset moves as leading indicator
    lead_lag_pairs: # Leader→follower mapping (leader yf_ticker → follower series prefix)
      "^GSPC": "KXINXU"
      "^IXIC": "KXINXU"
      "^NDX": "KXNASDAQ100U"
    lead_lag_min_move_pct: 0.003 # Min absolute move in leader to trigger signal
    lead_lag_edge_bonus: 0.02 # Edge bonus/penalty when lead-lag signal is active
    lead_lag_lookback_bars: 5 # Bars of leader data used to compute momentum
  # Runtime merge: one series ticker per line (# comments ok). Ollama loop / apply_series_blacklist.py add/remove via this file (no YAML churn).
  blacklist_extra_file: ~/.trading-bot-data/series_blacklist_auto.txt
  # whitelist: ["KXBTCD", "KXETHD"]   # Only evaluate these series (optional)
  # Static YAML ban list (empty = rely on blacklist_extra_file + scripts to populate dynamically)
  blacklist: []
  # Optional: blacklist: ["KXINXU"]  # also unions blacklist_extra_file on each compare_historical run
  # strategy_engine options: vol_regime (default), default_threshold, strict_threshold (1.25× min edge — research / A/B)

# Local historical storage (SQLite). Data in ~/.trading-bot-data/ — not committed to git.
# Speeds runs (yf cache), builds history for backtesting and calibration.
storage:
  enabled: true
  data_dir: ~/.trading-bot-data # Or TRADING_BOT_DATA_DIR env var

# Order execution (Kalshi & Gemini) - balance-aware, 4xx-resilient
# Underlying: yfinance + live snapshot — not exchange websocket latency; favor limit/maker fills (taker fees are higher).
trading:
  dry_run: false # Set true for paper runs until forward performance recovers (preview: --preview --no-llm)
  max_pct_of_balance: 0.40 # INCREASED (was 0.20) to allow single $2 trades on $5 accounts
  max_total_buy_pct: 0.80 # INCREASED (was 0.50) to avoid skipping trades on small balances
  min_contracts: 1 # skip if capped count < this
  # Dust-to-trade: when venue balance ≤ threshold, promote best zero-count BUY to x1 after budget pass (data + compounding on micro bankrolls)
  dust_trade_enabled: true
  dust_trade_max_balance_cents: 1000 # Reduced from 1000
  # Pre-budget: if balance ≤ cap (or ≤ dust_trade_max when unset), force count=1 on BUY rows still at 0
  micro_balance_force_min_one_contract: true
  micro_balance_max_balance_cents: 500 # 0 = reuse dust_trade_max_balance_cents ($10); set e.g. 300 for $3-only
  # Kalshi: when a buy would skip, place 1 contract at max affordable price (see kalshi_client).
  # Gemini: when balance_cents < this threshold, sizing uses 100% of balance for max_spend (not only max_pct_of_balance).
  # Set above your typical small balance (e.g. 500 = $5) so $3 wallets are not stuck at 18%×$3 < min contract.
  min_balance_for_limit_fallback_cents: 300 # Reduced from 500

# Backtest realism settings
backtest:
  synthetic_slippage_bps: 100 # +1% entry slippage in synthetic mode
  # Winner haircut in synthetic backtest only (live ignores this). 4000 bps = 40% — too harsh vs tight Kalshi/Gemini books.
  synthetic_win_slippage_tax_bps: 1800 # ~18% gross win tax: still conservative exit/slippage stress without killing EV in reports
  synthetic_fill_min_dwell_minutes: 10 # Require price to remain favorable this long before counting synthetic fill
  synthetic_liquidity_friction_cents: 0.75 # Flat friction cost per synthetic trade (spread/rounding drag)
  synthetic_assumed_order_size: 10 # Used for partial-fill backtest when depth is available
  daily_report_dir: ~/.trading-bot-data/reports # Daily launchd report output directory (avoids macOS Desktop privacy restrictions)
  daily_report_days_short: 7 # Short-window health check shown in daily report
  daily_report_days_long: 30 # Longer-window trend check shown in daily report
  pre_push_enabled: true # Run backtest guard on git push
  pre_push_mode: real # real|synthetic guard mode
  pre_push_days: 30 # Guard lookback window
  pre_push_min_trades: 20 # Minimum trades required for meaningful gate
  pre_push_fail_on_insufficient_trades: false # true blocks push if trades < min_trades
  pre_push_min_win_rate: 0.20 # High-edge books can look “low WR”; PnL-first: pair with pre_push_min_pnl_cents / Sharpe flags
  pre_push_min_pnl_cents: 0 # Block push when realized PnL (¢) in window is below this — primary $ guard vs WR alone
  pre_push_require_positive_sharpe: false # Optional stricter risk-adjusted gate
  taker_edge_threshold: 0.25
