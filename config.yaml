# =============================================================================
# Kalshi Trading Bot Configuration
# =============================================================================
# Override with env vars: MARKETS (comma-separated), POLL_INTERVAL_SECONDS

# Markets to watch: list of market tickers or series tickers
# Examples: KALSHI_YES (elections), KXHIGHNY (weather), KXBTC-25MAR15 (BTC)
markets:
  - KXBTCD
  - KXETHD
  - KXSOLD
  - KXINXU
  - KXXRPD

# How often to poll markets (seconds)
poll_interval_seconds: 60

# yfinance tickers: Kalshi series → Yahoo Finance ticker (no API key required)
# See https://github.com/ranaroussi/yfinance for ticker formats
yfinance_tickers:
  KXBTCD: "BTC-USD"
  KXETHD: "ETH-USD"
  KXSOLD: "SOL-USD"
  KXINXU: "^GSPC" # S&P 500
  KXXRPD: "XRP-USD" # XRP (Ripple)

# Strategy for compare_historical.py (BUY YES / BUY NO / SKIP)
strategy:
  strategy_engine: vol_regime # Default production strategy engine; compare_historical routes rec decisions through this interface
  # Defensive preset: wider edge + less concentration + trust market more (see docs/IMPROVEMENTS.md § profitability)
  min_edge: 0.25 # Raised from 0.22 due to 29.4% win rate and 8-loss streak; higher bar for quality entries
  # Easy win: disabled — high-priced "aligned" YES was a major tail-risk / steamroller profile on crypto
  enable_easy_win: false
  min_edge_easy_win: 0.03 # If re-enabled, keep above fee floor; must stay <= min_edge
  easy_win_min_p_win: 0.93 # Raised from 0.90; model overconfidence means 90% is unreliable — require near-certainty
  easy_win_min_market_p: 0.88 # Raised from 0.85; tighter agreement required to avoid YES-biased easy wins
  min_yes_price: 0.05 # Skip BUY YES when market YES < 5¢ (market thinks <5% chance). NO vol override.
  yes_overconfidence_extra_edge: 0.04 # Extra edge required for BUY YES to offset structural model bullish bias
  model_probability_shrinkage: 0.75 # Pull hist_p toward 0.5: adjusted = 0.5 + shrinkage*(hist_p - 0.5). Lower = more compression.
  max_buy_yes_strike_above_pct: 0.10 # More symmetric strike filter to avoid one-sided YES/NO suppression
  max_buy_no_strike_above_pct: 0.10 # More symmetric strike filter to avoid one-sided YES/NO suppression
  min_no_price: 0.05 # Raised from 0.02; 1-2¢ NO contracts have near-zero EV after fees
  days_back: 365 # Days of historical data for P(above/below). Longer = more stable empirical P
  days_to_expiry: 30 # For volatility model (log-normal)
  skip_buy_no_above_cushion: 0.01 # Threshold still computed, but enforcement is controlled by enforce_no_above_rule
  sell_losing_pct: 0.55 # Fallback fixed threshold when dynamic_sell_threshold is off; sell when P(lose) >= this
  dynamic_sell_threshold: true # EV-optimal: sell when P(lose) > 1 - (bid - exit_fee). Adapts threshold to current bid price.
  limit_dip_pct: 0.05 # Lowered from 7% to 5%; tighter stop-loss given loss streak
  limit_order_mode: layered # fixed_pct | dynamic_tick | layered
  tick_offset: 1 # Penny-jump one tick above best bid when mode uses dynamic ticks
  max_inventory_skew_pct: 0.10 # Inventory skew cap: less aggressive re-buys on crowded same-side inventory
  min_stability_duration_seconds: 15 # Reduced from 30s; faster re-entry after short dips
  min_order_book_depth: 20 # Depth target; layered mode scales size instead of hard skipping when thinner
  cancel_on_vol_spike: true # Cancel resting BUY limits and block new BUY limits while vol-spike safety is active
  cancel_all_on_regime_shift: true # During momentum crash or vol-spike regime, cancel resting BUY limits before re-quoting
  limit_order_ttl_minutes: 30 # Cancel and refresh resting BUY limits older than this TTL
  near_expiry_keep_dte: 0.02 # Don't cancel resting BUY limits for want_better_price when DTE < this (~30 min)
  max_entries_per_ticker: 3 # Max filled/pending entries per ticker; prevents re-entering the same losing contract
  layered_order_levels: 3 # Used by layered mode to spread large intents across deeper quote levels
  limit_dip_pct_high_confidence: 0.15 # When P(win) >= 90%, use larger dip (15%) — prioritize aggressive limits on high-certainty contracts
  limit_dip_pct_price_decline: 0.10 # When model suggests contract price might decrease (vol model on, or dte >= 2), use this dip (10%) to prioritize limit orders
  # DTE-confidence dip scaling: when resolution is far out AND model is confident,
  # place deeper limit orders to catch uncertainty-driven price dips.
  # Markets with distant resolution are prone to mean-reverting dips even when
  # the eventual outcome is near-certain; deeper limits capture these.
  far_dte_dip_scaling_enabled: true # Enable DTE-proportional limit dip scaling
  far_dte_threshold_days: 0.042 # Consider resolution "far" when DTE > ~1 hour (crypto can be hourly)
  far_dte_dip_scale_per_day: 0.015 # Add 1.5% more dip per day of DTE beyond threshold
  far_dte_max_extra_dip: 0.12 # Cap additional DTE-based dip at 12%
  far_dte_min_confidence: 0.80 # Only apply DTE dip scaling when P(win) >= 80%
  far_dte_confidence_boost: 1.5 # When P(win) >= 90%, multiply the DTE extra dip by this
  vol_blend_weight: 0.35 # Reduced from 0.45; further reduce vol model weight due to continued overconfidence
  use_intraday_empirical: true # Use yfinance 1h data for empirical P on intraday (5pm crypto, 4pm S&P). False = pure vol model for intraday.
  use_ewma_vol: true # Use EWMA for time-varying vol instead of sample variance. Better for regime changes.
  ewma_lambda: 0.94 # EWMA decay (λ); higher = more weight on past. 0.94 is RiskMetrics-style for daily.
  intraday_ewma_lambda: 0.90 # Faster intraday EWMA response for flash moves while keeping daily lambda stable
  vol_model: auto # auto|ewma|garch|sample. auto uses GARCH(1,1) when available, then falls back safely.
  garch_min_returns: 80 # Minimum return observations before enabling GARCH fit in auto/garch mode
  intraday_other_min_p_win: 0.90 # For intraday at non-standard times (e.g. 8pm ET): only buy when P(win) >= 90% (almost certain)
  intraday_other_min_p_win_with_vol: 0.80 # When --use-volatility: use 80% instead (vol model already accounts for time & vol)
  # Fees: Kalshi & Gemini both use maker fee = rate × P × (1−P) per contract (rounded up to 1¢)
  kalshi_maker_fee_rate: 0.0175 # 1.75% maker. min_edge is net edge after fees (e.g. 0.01 = 1¢ profit per contract)
  kalshi_sp500_maker_fee_rate: 0.00875 # Lower maker fee assumption for S&P 500-style index markets
  gemini_maker_fee_rate: 0.0175 # 1.75% maker; same formula as Kalshi
  min_fee_per_order: 0.01 # Fee floor used in edge math for small orders/contracts
  # Systematic edges (QuantPedia: arbitrage, cross-platform hedging)
  min_arb_fee: 0.02 # Min edge for arb (2%): buy-all when yes_ask+no_ask < 1 - fee
  enable_intra_arb: true # Intra-exchange: buy YES+NO when sum < 1 (same market)
  enable_inter_arb: true # Inter-exchange: buy YES on one platform + NO on other when sum < 1 (Kalshi/Gemini hedge)
  arb_inter_require_group_preflight: true # Require both inter-arb legs to pass shared balance preflight before BUY execution
  inter_arb_balance_aware_routing: true # Prefer inter-arb route that keeps cheaper leg on lower-balance account while preserving arb
  arb_inter_allow_single_leg_fallback: false # Paired inter-arb only — avoids naked directional leg when one venue can't fund
  # Absolute winner: when buying very cheap (e.g. 1¢) on near-certainty (P≥95%), buy more contracts
  absolute_winner_min_p_win: 0.95 # P(win) must be at least this to treat as "absolute winner"
  absolute_winner_max_price: 0.05 # Price must be at or below this (e.g. 5¢)
  absolute_winner_max_pct_of_balance: 0.02 # Hard cap: 20% per "sure thing" was bankroll risk; 2% limits black-swan damage
  absolute_winner_max_contracts: 500 # Cap contracts per absolute-winner order (still respects balance)
  # Calibration: use historical prediction outcomes to improve recommendations (FreqAI-style)
  use_calibration: true # Consult resolved predictions; disable favor-YES when "above+YES" underperforms
  favor_yes_when_above_strike: false # Disable SKIP→BUY YES upgrade to reduce YES bias
  enforce_no_above_rule: false # Disable forced BUY NO suppression when price is above strike
  min_calibration_samples: 5 # Min resolved "above+YES" trades before applying calibration penalty
  calibration_min_win_rate_above_yes: 0.55 # More conservative: require stronger observed above+YES performance
  calibration_extra_edge_above_yes: 0.05 # When "above+YES" underperforms, require this extra edge before BUY YES
  calibration_extra_edge_overall: 0.05 # When overall win rate < 50%, add this to min_edge globally
  min_calibration_samples_overall: 20 # Min resolved trades before applying overall min_edge bump
  use_bucket_penalty: true # Scale hist_p down when hist_p bucket has lower win rate than expected (overconfidence dampening)
  min_bucket_samples: 5 # Min trades in bucket before applying bucket penalty
  min_vol_confidence_far_otm: 0.97 # Require vol model ≥97% (not 95%) for BUY YES when strike far above current; targets losing "above X"
  calibration_loss_weight: 1.5 # Weight losers 1.5x in calibration (learn more from mistakes; 1.0 = equal weight)
  enable_sell_and_rebuy: false # Off by default — reduces fee churn and re-entry into the same bad tick on fast markets
  # P(lose) blend: incorporate market odds; weight increases as we approach resolution (markets more accurate near expiry)
  p_lose_blend_market_max_weight: 0.5 # At expiry, max weight given to market odds (0=model only; 0.5=50/50 at expiry; 1=100% market at expiry)
  p_lose_blend_market_half_life_days: 0.5 # Half-life in days; at dte=0.5 days (~12h to close), market weight = half of max
  use_kelly: true # Kelly criterion for position sizing — reduces size for farther-OTM contracts (lower P(win))
  kelly_fraction: 0.25 # Fractional Kelly, e.g. 0.25 = quarter-Kelly (safer; full Kelly can be aggressive)
  dynamic_kelly_enabled: true # Adapt Kelly down when calibration quality degrades
  dynamic_kelly_floor: 0.10 # Min Kelly fraction floor under stress
  dynamic_kelly_stress_fraction: 0.10 # Kelly target when calibration win rate is in stress regime
  dynamic_kelly_stress_win_rate: 0.45 # If calibration win rate <= this, use stressed Kelly
  dynamic_kelly_recovery_win_rate: 0.55 # If calibration win rate >= this, restore base Kelly
  enable_two_sided_quotes: true # Infer fair level and allow symmetric YES/NO opportunities around it
  two_sided_quote_min_edge: 0.03 # Aligned with higher min_edge; still must be <= min_edge
  macro_signal_enabled: true # Include macro cross-asset context in signal model
  macro_signal_tickers: ["SPY", "UUP"] # More reliable intraday proxy tickers for risk-on/risk-off macro signal
  use_live_price: true # Blend live + closes[-1] for vol model + safety; reflects sharp moves (e.g. last 10 min)
  live_price_weight: 0.6 # When both available: current_price = 0.6*live + 0.4*closes[-1]. Slightly prioritize live. Fallback: closes[-1] if snapshot fails.
  empirical_use_rolling_window: true # Empirical model uses rolling window for faster adaptation
  empirical_recent_days: 90 # Wider rolling window for more stable empirical P while still adapting to regime shifts
  empirical_recent_weight: 3.0 # Weight of recent samples relative to older data
  use_volatility_by_default: true # Use volatility model even without --use-volatility
  vol_dynamic_n0: 90 # Dynamic blend pivot: fewer samples => more vol weight, more samples => more empirical weight
  uncertainty_edge_mult: 0.5 # Reduced from 0.8; AH pipeline layers already dampen overconfidence
  stop_loss_pct: 0.20 # Tighter stop-loss for fast regime shifts
  weekend_edge_multiplier: 1.2 # Raise required edge on weekends when liquidity is thinner
  enable_momentum_protection: true # Skip BUY YES during sharp downside momentum
  momentum_crash_threshold_pct: -0.05 # Widened from -3.5% to -5%; dips are where passive limit value is
  max_cross_platform_exposure: 0.30 # Cap combined Kalshi+Gemini exposure per underlying/resolution
  max_daily_loss_pct: 0.10 # Circuit breaker: block new buys if last 24h realized loss exceeds this fraction of balance
  max_daily_loss_cents: 0 # Optional absolute-loss circuit breaker in cents (0 disables absolute threshold)
  enable_vol_spike_safety: true # Safety mode on volatility regime break
  vol_spike_threshold_mult: 3.0 # Raised from 2.0; dips happen during vol spikes — don't cancel limits too early
  vol_spike_edge_multiplier: 2.0 # In safety mode, multiply min_edge by this factor
  enable_defensive_mode: true # Extreme-volatility circuit: switch to sells-only mode (no new buys)
  defensive_vol_ratio_threshold: 3.0 # Trigger defensive mode when short-vs-baseline realized vol ratio exceeds this
  enable_dynamic_stability_window: true # Scale stability guard window with volatility regime (ATR/vol ratio proxy)
  stability_vol_ratio_ref: 1.0 # Vol-ratio reference where stability multiplier starts from 1x
  stability_max_multiplier: 10.0 # Cap on dynamic stability-window expansion in extreme volatility
  enable_vol_regime_scaling: true # Continuous vol-ratio scaling for edge, limit depth, and size (beyond binary spike mode)
  vol_regime_edge_mult_per_x: 0.35 # Additional edge multiplier per +1.0x vol-ratio above baseline
  vol_regime_max_edge_mult: 2.5 # Cap for continuous edge multiplier from vol-ratio scaling
  vol_regime_dip_mult_per_x: 0.50 # Additional limit-dip multiplier per +1.0x vol-ratio above baseline
  vol_regime_max_dip_mult: 2.0 # Cap for limit-dip multiplier from vol-ratio scaling
  vol_regime_size_mult_per_x: 0.50 # Position-size dampening slope per +1.0x vol-ratio above baseline
  vol_regime_min_size_mult: 0.35 # Minimum retained size multiplier under extreme volatility
  enable_cross_exchange_sanity_gate: true # Block stale-side buys when one venue lags repricing during sharp spot moves
  cross_exchange_max_yes_gap: 0.08 # Maximum tolerated YES-price divergence between Gemini and Kalshi before blocking
  cross_exchange_spot_move_threshold_pct: 0.01 # Spot-move magnitude required before sanity-gate comparisons activate
  parity_penalty_enabled: true # Add dynamic extra edge to dominant side (YES/NO) from recent outcomes
  parity_lookback_days: 14 # Lookback window for directional parity stats
  parity_base_penalty: 0.03 # Increased from 0.02; stronger self-correction on dominant side
  parity_max_penalty: 0.20 # Doubled from 0.10; 6:1 YES:NO ratio needs more room to self-correct
  enable_strike_validation: true # Cross-check extracted strike against current price + market odds
  strike_validation_tolerance_pct: 0.05 # Tolerance band for threshold sanity checks
  enable_otm_smile_adjustment: true # Volatility smile proxy: boost vol for OTM strikes to avoid underestimating tails
  otm_smile_strength: 0.35 # Smile intensity; higher = larger OTM vol uplift
  otm_smile_max_mult: 2.0 # Cap OTM vol multiplier
  vol_distribution: student_t # Heavy-tail volatility distribution: normal or student_t
  vol_t_df: 4.5 # Stronger fat-tail penalty for extreme-fear volatility regimes
  vol_disagree_threshold: 0.30 # When |emp_p - vol_p| exceeds this, vol model is suspect — dampen blend and require extra edge
  vol_disagree_extra_edge: 0.08 # Extra min_edge added when models disagree beyond threshold
  vol_disagree_dampen_blend: 0.50 # Halve vol weight contribution when models strongly disagree
  intraday_vol_cap: 0.90 # Cap vol-model probability for intraday/hourly contracts (prevent 99%+ overconfidence)
  intraday_min_empirical_weight: 0.20 # Floor for empirical weight in intraday blending; prevents DTE decay from zeroing out the empirical signal

  # --- Adaptive learning: the bot learns from its own recent trades ---
  adaptive_learning_enabled: true # Master switch for all adaptive learning features
  adaptive_edge_lookback_hours: 6.0 # Look back this many hours for recent win rate
  adaptive_edge_min_trades: 8 # Need at least this many recent trades before adjusting
  adaptive_edge_scale_per_pct: 0.003 # Per 1% below 50% win rate, add this to min_edge (e.g. 30% WR → 20 * 0.003 = +0.06)
  adaptive_edge_max_extra: 0.15 # Cap on adaptive edge from recent performance
  loss_streak_threshold: 5 # After this many consecutive losses, activate circuit breaker
  loss_streak_extra_edge: 0.04 # Base extra edge per consecutive loss beyond threshold
  loss_streak_max_extra: 0.20 # Maximum total extra edge from loss streak
  series_cooldown_threshold: 4 # After N consecutive losses on same series (e.g. KXBTCD), add extra edge
  series_cooldown_extra_edge: 0.06 # Extra edge for series that are on a cold streak
  ewma_halflife_trades: 30 # EWMA halflife in trades (recent trades weighted exponentially more)
  ewma_edge_scale_per_pct: 0.004 # Per 1% below 50% EWMA win rate, add this to min_edge

  mc_enabled: true # Monte Carlo simulation: blend simulated paths with analytical CDF for tail-aware probability
  mc_paths: 10000 # Number of GBM paths to simulate (higher = more accurate, slower; 10k ≈ 50ms with numpy)
  mc_blend_weight: 0.3 # Weight of MC result vs analytical (0 = pure analytical, 1 = pure MC; 0.3 = 30% MC)
  liquidity_spread_bps_soft: 1500 # Start reducing size when spread proxy > 15%
  liquidity_spread_bps_hard: 4000 # Max size reduction at/above 40% spread proxy
  liquidity_min_size_multiplier: 0.20 # At hard spread, keep at least 20% of base size
  liquidity_missing_ask_multiplier: 0.80 # If ask unavailable, apply conservative 20% size haircut
  # ML/AI-style signal model: combine multiple signals into a unified P(YES)
  enable_signal_model: true # Use weighted feature model on top of empirical/volatility signals
  use_sklearn_calibration: true # Fit calibrator from resolved predictions (hist_p -> outcome)
  sklearn_calibration_method: isotonic # isotonic or platt
  sklearn_calibration_min_samples: 50 # Minimum resolved samples to fit calibrator
  enable_auto_signal_weight_fit: true # Learn signal-model feature weights from resolved predictions
  signal_weight_fit_min_samples: 150 # Minimum resolved predictions needed to fit feature weights
  signal_weight_fit_l2_c: 1.0 # Logistic regression inverse regularization strength (lower = stronger regularization)
  signal_model_weights:
    bias: 0.0
    emp_p: 1.8
    vol_p: 1.3
    market_yes: 0.3
    edge_yes: 1.2
    edge_no: -0.8
    moneyness: 0.2
    dte_norm: 0.1
    spread_norm: -0.5
    liquidity_consistency: 0.3
    rsi_norm: -0.3 # Oversold (low RSI) slightly boosts P(YES) for mean-reversion; overbought dampens
  # Anti-hallucination layers: reduce model overconfidence vs market reality
  anti_hallucination:
    bayesian_enabled: true # Bayesian update: blend model P with market price as prior
    bayesian_market_strength: 2.75 # Stronger pull toward market — Kalshi is efficient; reduces fake "edge" vs crowd
    ewma_prob_enabled: true # EWMA probability: weight recent data exponentially
    ewma_prob_span: 14 # EWMA half-life in days (14 = last 2 weeks dominate)
    ewma_prob_min_samples: 10 # Min data points before EWMA kicks in
    ewma_prob_blend_weight: 0.30 # EWMA blend weight (was hardcoded 0.50); lower = more trust in model vs EWMA
    vol_zscore_enabled: true # Vol Z-score gate: dampen confidence during vol spikes
    vol_zscore_short_window: 24 # Short vol window (bars) for current regime
    vol_zscore_long_window: 168 # Long vol window (bars) for baseline
    vol_zscore_threshold: 2.0 # Z-score above which tails are fattened
    vol_zscore_tail_mult: 0.3 # Reduced from 0.5; less aggressive pull toward 0.5 during vol spikes
    adaptive_edge_enabled: true # Require larger edge for cheap/expensive contracts
    adaptive_edge_cheap_threshold: 0.15 # Contracts below this YES price need extra edge
    adaptive_edge_expensive_threshold: 0.85 # Contracts above this YES price need extra edge
    adaptive_edge_otm_base_mult: 1.8 # Reduced from 2.5; less punishing for cheap/expensive contracts
    adaptive_edge_trend_opposed_mult: 1.5 # Reduced from 2.0; less punishing for trend-opposed trades
    adaptive_edge_strike_dist_mult: 1.2 # Strike distance scaling (was hardcoded 2.0); lower = less compounding with OTM mult
    regime_filter_enabled: true # EMA regime gate: block trend-opposed BUY YES
    regime_ema_period: 20 # EMA lookback period for trend detection
    regime_require_alignment: true # Require trend alignment for BUY YES
  # Alpha engine: OBI, markout PnL, vol-adjusted Kelly, lead-lag signal
  alpha_engine:
    obi_enabled: true # Order Book Imbalance: directional signal from bid/ask depth
    obi_edge_bonus_max: 0.04 # Max edge reduction when OBI strongly favors our trade direction
    obi_strong_threshold: 0.40 # OBI magnitude above which signal is actionable
    obi_min_total_size: 5.0 # Minimum combined bid+ask size for OBI to be valid
    markout_enabled: true # Toxic flow detection: track post-fill adverse selection
    markout_windows_minutes: [1, 5, 15] # Time windows (minutes) for markout PnL measurement
    markout_toxic_threshold_bps: -50.0 # Avg markout below this → ticker is toxic (adverse selection)
    markout_edge_penalty: 0.03 # Extra edge required for tickers flagged as toxic
    markout_min_samples: 5 # Min fills before toxic flow detection activates
    vol_kelly_enabled: true # Volatility-adjusted Kelly: shrink position size in high-vol regimes
    vol_kelly_baseline_vol: 0.02 # "Normal" vol level; Kelly unchanged at this level
    vol_kelly_max_shrink: 0.25 # Floor: Kelly never shrinks below 25% of base in extreme vol
    vol_kelly_lookback_bars: 24 # Bars of recent closes to compute current realized vol
    lead_lag_enabled: true # Lead-lag signal: use correlated asset moves as leading indicator
    lead_lag_pairs: # Leader→follower mapping (leader yf_ticker → follower series prefix)
      "^GSPC": "KXINXU"
      "^IXIC": "KXINXU"
    lead_lag_min_move_pct: 0.003 # Min absolute move in leader to trigger signal
    lead_lag_edge_bonus: 0.02 # Edge bonus/penalty when lead-lag signal is active
    lead_lag_lookback_bars: 5 # Bars of leader data used to compute momentum
  # whitelist: ["KXBTCD", "KXETHD"]   # Only evaluate these series (optional)
  # blacklist: ["KXINXU"]   # Exclude these series (optional)
  # strategy_engine options: vol_regime (default), default_threshold

# Local historical storage (SQLite). Data in ~/.trading-bot-data/ — not committed to git.
# Speeds runs (yf cache), builds history for backtesting and calibration.
storage:
  enabled: true
  data_dir: ~/.trading-bot-data # Or TRADING_BOT_DATA_DIR env var

# Order execution (Kalshi & Gemini) - balance-aware, 4xx-resilient
# Underlying: yfinance + live snapshot — not exchange websocket latency; favor limit/maker fills (taker fees are higher).
trading:
  dry_run: false # Set true for paper runs until forward performance recovers (preview: --preview --no-llm)
  max_pct_of_balance: 0.15 # Tighter per-order cap vs 20%; pairs with smaller absolute_winner slice
  max_total_buy_pct: 0.50 # max % of balance for ALL buys combined (budget-aware diversification)
  min_contracts: 1 # skip if capped count < this
  # When balance is below this (cents), place a limit order instead of skipping
  # E.g. 500 = $5: with $3 balance, place 1-contract limit at price we can afford (e.g. 60¢)
  min_balance_for_limit_fallback_cents: 300 # $3 minimum; avoids ultra-small fallback orders in thin books

# Backtest realism settings
backtest:
  synthetic_slippage_bps: 100 # +1% entry slippage in synthetic mode
  synthetic_win_slippage_tax_bps: 4000 # Extra realism tax on winners (default mirrors hard spread regime)
  synthetic_fill_min_dwell_minutes: 10 # Require price to remain favorable this long before counting synthetic fill
  synthetic_liquidity_friction_cents: 0.75 # Flat friction cost per synthetic trade (spread/rounding drag)
  synthetic_assumed_order_size: 10 # Used for partial-fill backtest when depth is available
  daily_report_dir: ~/.trading-bot-data/reports # Daily launchd report output directory (avoids macOS Desktop privacy restrictions)
  daily_report_days_short: 7 # Short-window health check shown in daily report
  daily_report_days_long: 30 # Longer-window trend check shown in daily report
  pre_push_enabled: true # Run backtest guard on git push
  pre_push_mode: real # real|synthetic guard mode
  pre_push_days: 30 # Guard lookback window
  pre_push_min_trades: 20 # Minimum trades required for meaningful gate
  pre_push_fail_on_insufficient_trades: false # true blocks push if trades < min_trades
  pre_push_min_win_rate: 0.35 # Keep realistic for high-edge payout profile; guard still enforces pnl floor
  pre_push_min_pnl_cents: 0 # Block push when pnl below this
  pre_push_require_positive_sharpe: false # Optional stricter risk-adjusted gate
