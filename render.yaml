services:
  - type: worker
    name: trading-bot
    env: python
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    disk:
      name: trading-bot-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DB_PATH
        value: /var/data/trading_bot.db
    buildFilter:
      paths:
        - "main.py"
        - "db.py"
        - "report.py"
        - "ingestion/**"
        - "risk_engine/**"
        - "logging/**"
        - "requirements.txt"
        - "pyproject.toml"
      ignoredPaths:
        - "tests/**"
        - ".github/**"
        - ".githooks/**"
        - "README.md"
        - ".gitignore"
