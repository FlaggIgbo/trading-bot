# Run on git push: ruff (Python linter + formatter) and prettier (YAML/JSON)
# Install: pre-commit install --hook-type pre-push
# Manual run: pre-commit run --all-files
default_install_hook_types: [pre-push]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        types_or: [yaml, json, markdown]
        exclude: ^(launchd/.*\.plist)$

  - repo: local
    hooks:
      - id: config-validator
        name: Config validator (pre-push)
        entry: .venv/bin/python scripts/validate_config.py
        language: system
        pass_filenames: false
      - id: backtest-guard
        name: Backtest guard (pre-push)
        entry: .venv/bin/python scripts/backtest_guard.py
        language: system
        pass_filenames: false
